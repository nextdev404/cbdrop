<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1d28" />
      <stop offset="50%" stop-color="#11131a" />
      <stop offset="100%" stop-color="#0a0b10" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a78ff" />
      <stop offset="100%" stop-color="#5e5ce6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2fa5c" />
      <stop offset="100%" stop-color="#b4d816" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.3" />

  <!-- Inner circle accent glow -->
  <circle cx="256" cy="256" r="160" fill="url(#primaryGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Download Arrow & Media Symbol -->
  <g filter="url(#glow)">
    <!-- Tray / Base -->
    <path d="M144 340 H368 A16 16 0 0 1 384 356 V360 A16 16 0 0 1 368 376 H144 A16 16 0 0 1 128 360 V356 A16 16 0 0 1 144 340 Z" fill="url(#accentGrad)" />

    <!-- Stem of Arrow -->
    <path d="M228 136 H284 A12 12 0 0 1 296 148 V248 H338 A14 14 0 0 1 348 272 L266 352 A14 14 0 0 1 246 352 L164 272 A14 14 0 0 1 174 248 H216 V148 A12 12 0 0 1 228 136 Z" fill="url(#primaryGrad)" />
  </g>

  <!-- Top speed dot -->
  <circle cx="256" cy="110" r="12" fill="url(#accentGrad)" />
</svg>
